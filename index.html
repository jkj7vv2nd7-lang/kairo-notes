<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairo ノート ― MarkdownノートOS</title>
<meta name="description" content="標準Markdownを基盤にした、ローカルファーストのノートアプリ。文書・ボード・キャンバスの3視点と、非破壊のAI整理。">
<meta name="theme-color" content="#2e2766">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Kairo ノート ― MarkdownノートOS">
<meta property="og:description" content="記録と整理を分断しない、ローカルファーストのMarkdownノート。AI整理は差分プレビュー→承認→実行（ロールバック可）の非破壊設計。">
<meta property="og:type" content="website">
<meta property="og:image" content="og-image.png">
<style>
:root{
  --teal:#3d348b; --teal-dark:#2e2766; --accent:#e8a33d; --bg:#f5f3fa; --card:#fffefa;
  --ink:#28243c; --muted:#6f6a85; --line:#d9d4e8; --danger:#b03a2e; --ok:#2e7d4f;
  --del-bg:#fbe9e4; --add-bg:#e6f4ea;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.65; }
header.top{ background:radial-gradient(420px 200px at 88% -40%, rgba(232,163,61,.38), rgba(232,163,61,0) 60%), radial-gradient(520px 280px at -10% 130%, rgba(140,70,180,.5), rgba(140,70,180,0) 62%), linear-gradient(118deg, #221d54 0%, #3d348b 58%, #5b2a86 100%); color:#fff; padding:13px 16px; display:flex; align-items:center; gap:11px; position:sticky; top:0; z-index:30; border-bottom:3px solid var(--accent); box-shadow:0 4px 18px rgba(34,29,84,.35); }
header.top img{ width:42px; height:42px; border-radius:10px; border:2px solid rgba(232,163,61,.95); box-shadow:0 2px 10px rgba(0,0,0,.35); }
header.top .t{ font-size:22px; font-weight:800; letter-spacing:.04em; }
header.top .t .gold{ color:#f2b95c; }
header.top .sub{ font-size:12px; opacity:.88; letter-spacing:.02em; }
header.top .sp{ flex:1; }
.iconbtn{ background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:10px; font-size:18px; padding:8px 12px; cursor:pointer; }
main{ padding:14px 14px 110px; max-width:1180px; margin:0 auto; }
.bottombar{ position:fixed; left:0; right:0; bottom:0; z-index:40; background:#fffdf8; border-top:1px solid var(--line); display:flex; gap:6px; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -3px 14px rgba(60,50,20,.08); }
.bottombar button{ flex:1; min-height:54px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer; padding:4px 2px; }
.bottombar button.on{ background:var(--teal); border-color:var(--teal); color:#fff; }
.bottombar button.new{ background:linear-gradient(135deg, #f0b95a, #dd9222); border-color:#dd9222; color:#2e2766; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
.card h2{ font-size:18px; margin:2px 0 10px; }
.btn{ display:inline-block; min-height:48px; padding:10px 18px; border-radius:11px; border:1.5px solid var(--teal); background:var(--teal); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
.btn.sub{ background:#fff; color:var(--teal); }
.btn.ghost{ background:#fff; color:var(--ink); border-color:var(--line); }
.btn.warn{ background:#fff; color:var(--danger); border-color:var(--danger); }
.btn:disabled{ opacity:.45; cursor:default; }
.btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
.btnrow .btn{ flex:1; }
input[type=text],input[type=password],textarea,select{ width:100%; font-size:16px; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-family:inherit; }
textarea{ line-height:1.6; }
label.flabel{ display:block; font-size:13px; font-weight:700; color:var(--muted); margin:12px 0 4px; }
.small{ font-size:13px; color:var(--muted); }
.msg{ background:#fdf3e0; border:1px solid #ecd9ae; border-radius:10px; padding:10px 12px; margin:10px 0; font-size:14px; }
.hidden{ display:none !important; }
.chip{ display:inline-block; padding:5px 12px; border-radius:999px; border:1.5px solid var(--line); background:#fff; font-size:13px; font-weight:700; cursor:pointer; margin:0 6px 6px 0; }
.chip.on{ background:var(--teal); color:#fff; border-color:var(--teal); }
.tag{ display:inline-block; background:#efeafd; color:var(--teal-dark); border-radius:6px; padding:1px 8px; font-size:12px; font-weight:700; margin-right:5px; }
/* 文書ビュー */
.docwrap{ display:flex; gap:14px; align-items:flex-start; }
.notelist{ width:308px; flex:none; }
.noteitem{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:9px; cursor:pointer; }
.noteitem.on{ border-color:var(--teal); box-shadow:0 0 0 2px rgba(61,52,139,.28); }
.noteitem .ttl{ font-weight:800; font-size:16px; }
.noteitem .meta{ font-size:12px; color:var(--muted); margin-top:3px; }
.editor{ flex:1; min-width:0; }
.edtitle{ font-size:20px; font-weight:800; }
textarea.ed{ min-height:300px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:15px; }
.seg{ display:flex; gap:6px; margin:10px 0; }
.seg button{ flex:1; min-height:44px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-weight:700; font-size:15px; cursor:pointer; }
.seg button.on{ background:var(--teal); color:#fff; border-color:var(--teal); }
.preview{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; min-height:300px; overflow-wrap:break-word; }
.preview h1{ font-size:24px; border-bottom:2px solid var(--line); padding-bottom:6px; }
.preview h2{ font-size:20px; margin-top:22px; }
.preview h3{ font-size:17px; margin-top:18px; }
.preview code{ background:#f0ead8; padding:1px 6px; border-radius:5px; font-size:14px; }
.preview pre{ background:#26312e; color:#f2efe4; padding:12px; border-radius:10px; overflow-x:auto; }
.preview pre code{ background:none; color:inherit; padding:0; }
.preview blockquote{ border-left:4px solid var(--teal); margin:10px 0; padding:4px 12px; color:var(--muted); background:#f4f7f5; }
.preview a{ color:var(--teal-dark); }
.preview a.wikilink{ color:var(--teal-dark); font-weight:700; text-decoration:underline; text-underline-offset:2px; }
.wikimiss{ color:var(--muted); }
.preview img{ max-width:100%; height:auto; border:1px solid var(--line); border-radius:8px; background:#fff; }
/* 手書きパッド・音声メモ */
.inktools{ display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
.inktools button{ flex:1; min-height:46px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-weight:700; font-size:14px; cursor:pointer; padding:4px; }
.inktools button.on{ background:var(--teal); color:#fff; border-color:var(--teal); }
#inkCanvas{ width:100%; height:330px; background:#fff; border:1.5px solid var(--line); border-radius:12px; touch-action:none; display:block; }
.voicebig{ width:100%; min-height:64px; font-size:19px; border-radius:14px; }
.rec{ background:var(--danger) !important; border-color:var(--danger) !important; }
.outline{ font-size:14px; }
.outline button{ display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px dashed var(--line); padding:7px 4px; font-size:14px; cursor:pointer; color:var(--ink); }
.outline .lv2{ padding-left:18px; } .outline .lv3{ padding-left:32px; } .outline .lv4{ padding-left:44px; }
.relitem{ border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-bottom:8px; background:#fff; }
.relitem .ttl{ font-weight:700; font-size:15px; }
.backbtn{ display:none; }
/* ボード */
.board{ display:flex; gap:12px; overflow-x:auto; padding-bottom:10px; align-items:flex-start; }
.col{ flex:none; width:262px; background:#efe9da; border:1px solid var(--line); border-radius:14px; padding:10px; min-height:220px; }
.col h3{ margin:2px 2px 10px; font-size:16px; }
.col .cnt{ color:var(--muted); font-size:13px; }
.bcard{ background:#fff; border:1px solid var(--line); border-radius:11px; padding:10px 11px; margin-bottom:9px; cursor:grab; touch-action:none; }
.bcard .ttl{ font-weight:800; font-size:15px; }
.bcard select{ margin-top:8px; padding:6px 8px; font-size:14px; min-height:38px; }
.bcard.dragging{ opacity:.85; box-shadow:0 10px 24px rgba(40,40,20,.28); z-index:60; position:relative; }
/* キャンバス */
.canvaswrap{ overflow:auto; border:1px solid var(--line); border-radius:14px; background:#efecf7; max-height:70vh; }
.canvas{ position:relative; width:2300px; height:1500px; background-image:radial-gradient(#c6bfe2 1.2px, transparent 1.3px); background-size:26px 26px; }
.ccard{ position:absolute; width:238px; background:#fffdf4; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; box-shadow:0 3px 10px rgba(60,50,20,.10); cursor:grab; touch-action:none; }
mark{ background:#ffe58a; color:inherit; padding:0 1px; border-radius:2px; }
.noteitem .excerpt{ font-size:13px; color:var(--muted); margin-top:4px; line-height:1.5; }
.mapwrap{ overflow:auto; border:1px solid var(--line); border-radius:14px; background:#eceaf6; max-height:70vh; }
.mapboard{ position:relative; width:1700px; height:1200px; background-image:radial-gradient(#bcb1de 1.2px, transparent 1.3px); background-size:26px 26px; }
.mapboard svg{ position:absolute; left:0; top:0; pointer-events:none; }
.mnode{ position:absolute; display:flex; align-items:center; gap:7px; min-width:76px; min-height:44px; max-width:190px; padding:9px 12px; background:#fffdf4; border:1.5px solid var(--teal); border-radius:999px; box-shadow:0 3px 10px rgba(60,50,20,.12); cursor:grab; touch-action:none; font-size:13.5px; font-weight:700; }
.mnode .dot{ flex:none; width:11px; height:11px; border-radius:50%; background:var(--accent); }
.mnode .mt{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mnode.iso{ border-color:var(--line); color:var(--muted); }
.mnode.iso .dot{ background:#c9c2ab; }
.ccard .ttl{ font-weight:800; font-size:15px; margin-bottom:4px; }
.ccard .ex{ font-size:12.5px; color:var(--muted); max-height:74px; overflow:hidden; }
.ccard.dragging{ box-shadow:0 12px 26px rgba(40,40,20,.30); z-index:60; }
/* AI */
.diffbox{ border:1px solid var(--line); border-radius:10px; background:#fff; padding:10px 12px; font-size:13.5px; max-height:320px; overflow:auto; white-space:pre-wrap; overflow-wrap:break-word; }
.dl-del{ background:var(--del-bg); }
.dl-add{ background:var(--add-bg); }
.actitem{ border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; background:#fff; }
.actitem h4{ margin:0 0 6px; font-size:16px; }
.checkrow{ display:flex; gap:10px; align-items:flex-start; }
.checkrow input[type=checkbox]{ width:24px; height:24px; flex:none; margin-top:2px; }
.targetitem{ display:flex; gap:10px; align-items:center; border-bottom:1px dashed var(--line); padding:8px 2px; }
.targetitem input[type=checkbox]{ width:24px; height:24px; flex:none; }
/* モーダル */
.overlay{ position:fixed; inset:0; background:rgba(30,35,30,.45); z-index:80; display:flex; align-items:flex-end; justify-content:center; }
.sheet{ background:var(--card); width:100%; max-width:640px; max-height:88vh; overflow:auto; border-radius:18px 18px 0 0; padding:18px; }
.sheetfoot{ position:sticky; bottom:-18px; margin:14px -18px -18px; padding:10px 18px 18px; background:var(--card); border-top:1px solid var(--line); box-shadow:0 -8px 14px rgba(38,49,46,.08); }
.sheetfoot .btnrow:first-of-type{ margin-top:0; }
.scrollhint{ text-align:center; font-size:12px; color:var(--muted); padding:2px 0 6px; }
.sheet h2{ margin-top:0; }
footer{ text-align:center; color:var(--muted); font-size:13px; padding:10px 14px 4px; }
@media (max-width:760px){
  .docwrap{ display:block; }
  .notelist{ width:100%; }
  .editor{ display:none; }
  .docwrap.editing .notelist{ display:none; }
  .docwrap.editing .editor{ display:block; }
  .backbtn{ display:inline-block; }
}
</style>
</head>
<body>
<header class="top">
  <img src="icon-192.png" alt="">
  <div>
    <div class="t">Kairo <span class="gold">ノート</span></div>
    <div class="sub">MarkdownノートOS ― 記録と整理を分断しない</div>
  </div>
  <div class="sp"></div>
  <button class="iconbtn" onclick="go('settings')" aria-label="設定">⚙ 設定</button>
</header>
<main id="app"></main>
<footer>
  <div>Kairo ノート ver <span id="verFoot">1.0.0</span> ／ ノートはこの端末の中（IndexedDB）にだけ保存されます</div>
  <div style="margin-top:8px;"><button class="btn ghost" style="min-height:40px; padding:6px 14px; font-size:14px;" onclick="updateApp()">最新の版に更新する</button></div>
</footer>
<nav class="bottombar" id="bottombar"></nav>
<div id="modalRoot"></div>
<script>
"use strict";
const APP_VER = "1.3.0";
/* ============ ユーティリティ ============ */
const $ = s => document.querySelector(s);
function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function uid(){ return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function nowIso(){ const d = new Date(); const p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()); }
function fmtDate(iso){ if(!iso) return ""; return String(iso).slice(0, 10) + " " + String(iso).slice(11, 16); }
const STATUSES = { idea: "アイデア", doing: "進行中", done: "完了", keep: "保管" };
function statusLabel(s){ return STATUSES[s] || STATUSES.idea; }
/* ============ フロントマター（素のMarkdownを維持） ============ */
function parseNote(id, text){
  const fm = { title: "", tags: [], status: "idea", created: "", updated: "" };
  let body = String(text || "");
  const m = body.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if(m){
    body = body.slice(m[0].length);
    m[1].split(/\r?\n/).forEach(line => {
      const kv = line.match(/^([A-Za-z_]+):\s*(.*)$/);
      if(!kv) return;
      const k = kv[1], v = kv[2].trim();
      if(k === "title") fm.title = v.replace(/^"|"$/g, "");
      else if(k === "tags") fm.tags = v.replace(/^\[/, "").replace(/\]$/, "").split(",").map(s => s.trim().replace(/^"|"$/g, "")).filter(Boolean);
      else if(k === "status") fm.status = STATUSES[v] ? v : "idea";
      else if(k === "created") fm.created = v;
      else if(k === "updated") fm.updated = v;
    });
  }
  if(!fm.title){
    const h = body.match(/^#\s+(.+)$/m);
    fm.title = h ? h[1].trim() : "無題のノート";
  }
  return { id, fm, body };
}
function noteToMd(n){
  const f = n.fm;
  return "---\ntitle: " + f.title + "\ntags: [" + f.tags.join(", ") + "]\nstatus: " + f.status + "\ncreated: " + f.created + "\nupdated: " + f.updated + "\n---\n" + n.body;
}
/* ============ Markdown：ブロック解析（3視点の共通モデル） ============ */
function parseBlocks(body){
  const lines = String(body || "").split("\n");
  const blocks = [];
  let i = 0;
  while(i < lines.length){
    const ln = lines[i];
    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){ blocks.push({ type: "heading", level: h[1].length, text: h[2].trim() }); i++; continue; }
    if(/^```/.test(ln)){ const buf = []; i++; while(i < lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; } i++; blocks.push({ type: "code", text: buf.join("\n") }); continue; }
    if(/^\s*$/.test(ln)){ i++; continue; }
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){ blocks.push({ type: "hr" }); i++; continue; }
    if(/^>\s?/.test(ln)){ const buf = []; while(i < lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/, "")); i++; } blocks.push({ type: "quote", text: buf.join("\n") }); continue; }
    if(/^\s*([-*+]|\d+\.)\s+/.test(ln)){ const items = []; while(i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, "")); i++; } blocks.push({ type: "list", items }); continue; }
    const buf = [ln]; i++;
    while(i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6})\s/.test(lines[i]) && !/^```/.test(lines[i]) && !/^>\s?/.test(lines[i])){ buf.push(lines[i]); i++; }
    blocks.push({ type: "para", text: buf.join("\n") });
  }
  return blocks;
}
function wikiTitleMap(){
  const map = {};
  notes.forEach(n => { map[esc(n.fm.title)] = n.id; });
  return map;
}
function inlineMd(s){
  let t = esc(s);
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src) => {
    if(src.startsWith("kairo-img:")){
      const url = imgCache[src.slice(10)] || "";
      return url ? `<img src="${url}" alt="${alt}" loading="lazy">` : `<span class="small">（${alt || "手書き画像"}）</span>`;
    }
    if(/^(https:|data:image\/)/.test(src)) return `<img src="${src}" alt="${alt}" loading="lazy">`;
    return esc(alt);
  });
  t = t.replace(/\[\[([^\]]+)\]\]/g, (m, name) => {
    const id = wikiTitleMap()[name];
    if(id) return `<a href="#" class="wikilink" onclick="openNote('${id}'); return false;">${name}</a>`;
    return `<span class="wikimiss">[[${name}]]</span>`;
  });
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}
function blocksToHtml(blocks){
  return blocks.map(b => {
    if(b.type === "heading") return "<h" + b.level + ">" + inlineMd(b.text) + "</h" + b.level + ">";
    if(b.type === "code") return "<pre><code>" + esc(b.text) + "</code></pre>";
    if(b.type === "hr") return "<hr>";
    if(b.type === "quote") return "<blockquote>" + inlineMd(b.text).replace(/\n/g, "<br>") + "</blockquote>";
    if(b.type === "list") return "<ul>" + b.items.map(it => {
      const cb = it.match(/^\[([ xX])\]\s+(.*)$/);
      if(cb) return "<li>" + (cb[1].toLowerCase() === "x" ? "☑ " : "☐ ") + inlineMd(cb[2]) + "</li>";
      return "<li>" + inlineMd(it) + "</li>";
    }).join("") + "</ul>";
    return "<p>" + inlineMd(b.text).replace(/\n/g, "<br>") + "</p>";
  }).join("");
}
function outlineOf(blocks){ return blocks.filter(b => b.type === "heading"); }
function excerptOf(blocks, max){
  const parts = [];
  for(const b of blocks){
    if(b.type === "para" || b.type === "quote") parts.push(b.text);
    else if(b.type === "list") parts.push(b.items.join("、"));
    if(parts.join(" ").length >= (max || 90)) break;
  }
  return parts.join(" ").replace(/!\[[^\]]*\]\([^)]*\)/g, "（手書き画像）").replace(/\*\*/g, "").replace(/`/g, "").replace(/\s+/g, " ").slice(0, max || 90);
}
/* ============ IndexedDB（ノート実体とアプリ側メタデータ） ============ */
const DB_NAME = "kairo-notes-v1";
let dbPromise = null;
function dbOpen(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    const rq = indexedDB.open(DB_NAME, 2);
    rq.onupgradeneeded = () => {
      const db = rq.result;
      if(!db.objectStoreNames.contains("notes")) db.createObjectStore("notes", { keyPath: "id" });
      if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
      if(!db.objectStoreNames.contains("images")) db.createObjectStore("images", { keyPath: "id" });
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
  return dbPromise;
}
async function idbAll(store){
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction(store, "readonly").objectStore(store).getAll();
    rq.onsuccess = () => res(rq.result || []);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbPut(store, val){
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction(store, "readwrite").objectStore(store).put(val);
    rq.onsuccess = () => res();
    rq.onerror = () => rej(rq.error);
  });
}
async function idbGet(store, key){
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const rq = db.transaction(store, "readonly").objectStore(store).get(key);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  });

const HIST_CAP = 20;
let HIST_COALESCE_MS = 90000;
async function histGet(id){
  const v = await metaGet("hist:" + id, []);
  return Array.isArray(v) ? v : [];
}
async function pushHistory(id, oldMd, force){
  if(!oldMd) return;
  const list = await histGet(id);
  const last = list[list.length - 1];
  if(last && last.md === oldMd) return;
  if(!force && last && Date.now() - last.ts < HIST_COALESCE_MS) return;
  list.push({ ts: Date.now(), md: oldMd });
  while(list.length > HIST_CAP) list.shift();
  await metaSet("hist:" + id, list);
}
async function persistNote(n){
  const old = await idbGet("notes", n.id);
  const candidate = noteToMd(n);
  if(old && old.md !== candidate) await pushHistory(n.id, old.md);
  n.fm.updated = nowIso();
  await idbPut("notes", { id: n.id, md: noteToMd(n) });
}
function openHistory(id){
  const n = getNote(id); if(!n) return;
  histGet(id).then(list => {
    const rows = list.slice().reverse();
    openModal(`<h2>🕘 「${esc(n.fm.title)}」の履歴</h2>
    <p class="small">保存されるたびに、直前の形を控えとして残しています（最大${HIST_CAP}件）。戻しても今の形は控えに残るので、やり直せます。</p>
    ${rows.length ? rows.map(en => {
      const p = parseNote(id, en.md);
      const firstLine = (p.body.split("\n").map(s => s.trim()).find(s => s && !s.startsWith("#")) || "").slice(0, 60);
      return `<div class="relrow">
        <div class="relmain"><b>${esc(fmtDate(new Date(en.ts).toISOString()))}</b><br><span class="small">${esc(p.fm.title)}${firstLine ? " ― " + esc(firstLine) : ""}</span></div>
        <button class="mini" onclick="restoreHistory('${id}', ${en.ts})">この形に戻す</button>
      </div>`;
    }).join("") : `<p class="small">まだ履歴がありません。ノートを編集して保存すると、ここに控えが残ります。</p>`}
    <div class="sheetfoot"><div class="btnrow"><button class="btn ghost" onclick="closeModal()">閉じる</button></div></div>`);
  });
}
async function restoreHistory(id, ts){
  const n = getNote(id); if(!n) return;
  const list = await histGet(id);
  const en = list.find(x => x.ts === ts);
  if(!en) return;
  if(!confirm("この形に戻しますか？（今の形も控えに残ります）")) return;
  await pushHistory(id, noteToMd(n), true);
  const restored = parseNote(id, en.md);
  const idx = notes.findIndex(x => x.id === id);
  if(idx >= 0) notes[idx] = restored;
  await idbPut("notes", { id, md: en.md });
  closeModal();
  render();
}

}

function dragStart(e, el, id, mode){
  if(e.target.closest("select,button,input,textarea,a")) return;
  drag = { el, id, mode, sx: e.clientX, sy: e.clientY, moved: false };
  window.addEventListener("pointermove", dragMove);
  window.addEventListener("pointerup", dragEnd, { once: true });
}
function dragMove(e){
  if(!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if(!drag.moved && Math.hypot(dx, dy) < 7) return;
  drag.moved = true;
  drag.el.classList.add("dragging");
  drag.el.style.transform = "translate(" + dx + "px," + dy + "px)";
  if(drag.mode === "map") drawMapEdges();
}
async function dragEnd(e){
  window.removeEventListener("pointermove", dragMove);
  if(!drag) return;
  const d = drag; drag = null;
  d.el.classList.remove("dragging");
  d.el.style.transform = "";
  if(!d.moved){ currentId = d.id; view = "doc"; edMode = "edit"; render(); return; }
  if(d.mode === "board"){
    const cols = document.querySelectorAll(".col");
    for(const c of cols){
      const r = c.getBoundingClientRect();
      if(e.clientX >= r.left - 6 && e.clientX <= r.right + 6){ await setNoteStatus(d.id, c.dataset.status); break; }
    }
    render();
  } else if(d.mode === "canvas"){
    const x = Math.max(0, Math.min(2000, d.el.offsetLeft + (e.clientX - d.sx)));
    const y = Math.max(0, Math.min(1320, d.el.offsetTop + (e.clientY - d.sy)));
    d.el.style.left = x + "px"; d.el.style.top = y + "px";
    canvasPos[d.id] = { x: Math.round(x), y: Math.round(y) };
    await metaSet("canvasPos", canvasPos);
  } else if(d.mode === "map"){
    const x = Math.max(0, Math.min(1600, d.el.offsetLeft + (e.clientX - d.sx)));
    const y = Math.max(0, Math.min(1140, d.el.offsetTop + (e.clientY - d.sy)));
    d.el.style.left = x + "px"; d.el.style.top = y + "px";
    mapPos[d.id] = { x: Math.round(x), y: Math.round(y) };
    await metaSet("mapPos", mapPos);
    drawMapEdges();
  }
}

/* ============ つながりマップ（[[ ]]リンクの地図） ============ */
let mapPos = {};
function mapEdges(){
  const byTitle = new Map();
  notes.forEach(n => { if(n.fm.title) byTitle.set(n.fm.title, n.id); });
  const seen = new Set();
  const edges = [];
  for(const n of notes){
    const re = /\[\[([^\]]+)\]\]/g;
    let m;
    while((m = re.exec(n.body || "")) !== null){
      const target = byTitle.get(m[1].trim());
      if(!target || target === n.id) continue;
      const key = [n.id, target].sort().join("|");
      if(seen.has(key)) continue;
      seen.add(key);
      edges.push({ a: n.id, b: target });
    }
  }
  return edges;
}
function mapPosFor(n, i, total){
  if(mapPos[n.id]) return mapPos[n.id];
  const cx = 850, cy = 600;
  const r = Math.max(150, Math.min(260, 100 + total * 13));
  const ang = (Math.PI * 2 * i) / Math.max(1, total) - Math.PI / 2;
  return { x: Math.round(cx + r * Math.cos(ang) - 50), y: Math.round(cy + r * Math.sin(ang) - 22) };
}
function mapViewHtml(){

      <div class="btnrow" style="margin-bottom:0;"><button class="btn sub" onclick="resetMapLayout()">↺ 並べ直す（円形に整列）</button></div>
    </div>
    <div class="mapwrap"><div class="mapboard" id="mapBoard">
    <svg id="mapSvg" width="1700" height="1200"></svg>
    ${list.map((n, i) => {
      const p = mapPosFor(n, i, list.length);
      return `<div class="mnode ${linked.has(n.id) ? "" : "iso"}" data-id="${n.id}" style="left:${p.x}px; top:${p.y}px;" onpointerdown="dragStart(event, this, '${n.id}', 'map')"><span class="dot"></span><span class="mt">${esc(n.fm.title)}</span></div>`;
    }).join("")}
    </div></div>`;
}
function drawMapEdges(){
  const svg = document.getElementById("mapSvg");
  const board = document.getElementById("mapBoard");
  if(!svg || !board) return;
  const br = board.getBoundingClientRect();
  const center = id => {
    const el = board.querySelector(`.mnode[data-id="${id}"]`);
    if(!el) return null;
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2 - br.left, y: r.top + r.height / 2 - br.top };
  };
  svg.innerHTML = mapEdges().map(e => {
    const A = center(e.a), B = center(e.b);
    if(!A || !B) return "";
    return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#8f83c4" stroke-width="2" stroke-opacity="0.75"/>`;

function afterMapRender(){

function parseProposal(text){
  let t = String(text || "").trim();
  t = t.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
  const s = t.indexOf("{"), e = t.lastIndexOf("}");
  if(s < 0 || e <= s) throw new Error("AIの返答を読み取れませんでした");
  const obj = JSON.parse(t.slice(s, e + 1));
  if(!obj || !Array.isArray(obj.actions)) throw new Error("AIの返答に actions がありませんでした");
  const ok = [];
  for(const a of obj.actions){
    if(!a || typeof a !== "object") continue;
    if(a.type === "merge" && a.title && a.body) ok.push({ type: "merge", title: String(a.title), tags: Array.isArray(a.tags) ? a.tags.map(String) : [], status: STATUSES[a.status] ? a.status : "idea", body: String(a.body), sourceIds: Array.isArray(a.sourceIds) ? a.sourceIds.filter(id => getNote(id)) : [] });
    else if(a.type === "update" && a.id && getNote(a.id)) ok.push({ type: "update", id: a.id, title: a.title ? String(a.title) : null, tags: Array.isArray(a.tags) ? a.tags.map(String) : null, status: STATUSES[a.status] ? a.status : null, body: a.body != null ? String(a.body) : null });
    else if(a.type === "create" && a.title && a.body) ok.push({ type: "create", title: String(a.title), tags: Array.isArray(a.tags) ? a.tags.map(String) : [], body: String(a.body) });
    else if(a.type === "link" && a.fromId && a.toId && getNote(a.fromId) && getNote(a.toId) && a.fromId !== a.toId) ok.push({ type: "link", fromId: a.fromId, toId: a.toId, reason: String(a.reason || "") });
  }
  if(!ok.length) throw new Error("実行できる整理案がありませんでした");
  return { actions: ok };
}

/* ---- 差分表示 ---- */
function diffLines(a, b){
  const A = String(a).split("\n"), B = String(b).split("\n");
  if(A.length * B.length > 120000) return null;
  const dp = [];
  for(let i = 0; i <= A.length; i++) dp.push(new Uint32Array(B.length + 1));
  for(let i = A.length - 1; i >= 0; i--) for(let j = B.length - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while(i < A.length && j < B.length){
    if(A[i] === B[j]){ out.push({ t: " ", s: A[i] }); i++; j++; }
    else if(dp[i + 1][j] >= dp[i][j + 1]){ out.push({ t: "-", s: A[i] }); i++; }
    else { out.push({ t: "+", s: B[j] }); j++; }
  }
  while(i < A.length) out.push({ t: "-", s: A[i++] });
  while(j < B.length) out.push({ t: "+", s: B[j++] });
  return out;
}
function diffHtml(oldText, newText){
  const d = diffLines(oldText, newText);
  if(!d) return `<div class="diffbox">（大きな変更です：${String(oldText).split("\n").length}行 → ${String(newText).split("\n").length}行）</div>`;
  const shown = d.slice(0, 120);
  return `<div class="diffbox">${shown.map(l => `<div class="${l.t === "-" ? "dl-del" : l.t === "+" ? "dl-add" : ""}">${l.t === " " ? "　" : l.t} ${esc(l.s)}</div>`).join("")}${d.length > 120 ? `<div>…ほか ${d.length - 120} 行</div>` : ""}</div>`;
}
function actionTitle(a){
  if(a.type === "merge") return "🧩 統合：新しいノート「" + a.title + "」を作る";
  if(a.type === "update") return "✏️ 更新：「" + (getNote(a.id) || { fm: { title: "" } }).fm.title + "」を変更";
  if(a.type === "create") return "📄 新規：「" + a.title + "」を作る";
  if(a.type === "link") return "🔗 リンク：「" + (getNote(a.fromId) || { fm: { title: "" } }).fm.title + "」→「" + (getNote(a.toId) || { fm: { title: "" } }).fm.title + "」";

}

/* ---- スナップショット ---- */
async function loadSnaps(){ window.__snaps = await metaGet("snapshots", []); }
async function takeSnapshot(label){
  const snaps = await metaGet("snapshots", []);
  snaps.unshift({ id: uid(), ts: nowIso(), label, notes: notes.map(n => ({ id: n.id, md: noteToMd(n) })) });
  while(snaps.length > 5) snaps.pop();
  await metaSet("snapshots", snaps);
  window.__snaps = snaps;
}
async function rollbackSnapshot(id){
  const snaps = await metaGet("snapshots", []);
  const s = snaps.find(x => x.id === id);
  if(!s) return;
  if(!confirm("「" + s.label + "」の時点（ノート" + s.notes.length + "件）に戻しますか？現在のノート一式は置き換わります。")) return;
  await replaceAllNotes(s.notes.map(r => parseNote(r.id, r.md)));
  proposal = null;
  aiNote = "ロールバックしました（" + s.label + "）。";
  render();

async function deleteSnapshot(id){
  const snaps = (await metaGet("snapshots", [])).filter(x => x.id !== id);

  window.__snaps = snaps;
  render();
}
/* ---- 実行 ---- */
async function applyAction(a){
  if(a.type === "merge"){
    await createNote(a.title, a.body, a.tags, a.status);
  } else if(a.type === "create"){
    await createNote(a.title, a.body, a.tags, "idea");
  } else if(a.type === "update"){
    const n = getNote(a.id); if(!n) return;
    if(a.title) n.fm.title = a.title;
    if(a.tags) n.fm.tags = a.tags;
    if(a.status) n.fm.status = a.status;
    if(a.body != null) n.body = a.body;
    await persistNote(n);
  } else if(a.type === "link"){
    const from = getNote(a.fromId), to = getNote(a.toId);
    if(!from || !to) return;
    const line = "- 『" + to.fm.title + "』" + (a.reason ? " ― " + a.reason : "");
    if(from.body.includes("## 関連メモ")) from.body = from.body.replace(/\s*$/, "") + "\n" + line + "\n";
    else from.body = from.body.replace(/\s*$/, "") + "\n\n## 関連メモ\n" + line + "\n";
    await persistNote(from);
  }
}
async function executeProposal(){
  if(!proposal) return;
  const chosen = proposal.actions.filter((a, i) => {
    const el = document.getElementById("act-" + i);
    return el && el.checked;
  });
  if(!chosen.length){ alert("実行する案にチェックを入れてください。"); return; }
  if(!confirm(chosen.length + "件の整理を実行しますか？実行前に控え（スナップショット）が残ります。")) return;
  await takeSnapshot("AI整理の実行前（" + chosen.length + "件）");
  for(const a of chosen) await applyAction(a);
  proposal = null;
  aiNote = chosen.length + "件の整理を実行しました。元に戻したいときは、下のスナップショットからロールバックできます。";
  render();

function buildImportProposal(text, sourceLabel){
  const parsed = parseBulkText(text);
  const items = [];
  for(const p of parsed){
    const match = notes.find(n => n.fm.title === p.fm.title);
    if(match){
      const merged = { id: match.id, fm: { title: p.fm.title, tags: p.fm.tags, status: p.fm.status, created: match.fm.created, updated: p.fm.updated }, body: p.body };
      const before = noteToMd(match);
      const after = noteToMd(merged);
      if(after === before) continue;
      items.push({ kind: "update", id: match.id, title: p.fm.title, before, after, parsed: p, checked: true });
    } else {
      const after = noteToMd({ id: "new", fm: p.fm, body: p.body });
      items.push({ kind: "create", id: null, title: p.fm.title, before: "", after, parsed: p, checked: true });
    }
  }

  renderImportProposal();

const FS_OK = typeof window.showDirectoryPicker === "function";

function fsMsg(t){

async function fsPickDir(){
  try{
    const handle = await window.showDirectoryPicker();
    const perm = await fsPermState(handle, true);
    if(perm !== "granted"){
      dirHandle = null;
      fsMsg("フォルダへの読み書きが許可されませんでした。もう一度「フォルダを選ぶ」を押して、許可の確認では「許可」を選んでください。");
      return;
    }
    dirHandle = handle;
    fsMsg("フォルダを選びました：" + handle.name + "（⬆ 読み込み・⬇ 書き出しが使えます）");
  }catch(e){
    if(e && e.name === "AbortError"){
      fsMsg("フォルダの選択がキャンセルされました。使うときは「フォルダを選ぶ」から選んでください。");
    } else {
      fsMsg("フォルダを選べませんでした（" + (e && e.name ? e.name : "エラー") + "）。もう一度お試しください。");
    }
  }
}
async function fsPermState(handle, request){
  if(!handle) return "denied";
  try{
    if(handle.queryPermission){
      const q = await handle.queryPermission({ mode: "readwrite" });
      if(q === "granted") return "granted";
    }
    if(request && handle.requestPermission){
      return await handle.requestPermission({ mode: "readwrite" });
    }
    return handle.queryPermission ? "denied" : "granted";
  }catch(e){
    return "denied";
  }
}
async function fsExport(){
  if(!dirHandle){ fsMsg("先にフォルダを選んでください。"); return; }
  if(await fsPermState(dirHandle, true) !== "granted"){ fsMsg("フォルダへの読み書きが許可されていません。「フォルダを選ぶ」から選び直してください。"); return; }
  try{
    let count = 0;
    for(const n of sortedNotes()){
      const fh = await dirHandle.getFileHandle(safeName(n.fm.title) + ".md", { create: true });
      const w = await fh.createWritable();
      await w.write(mdForExport(n));
      await w.close();
      count++;
    }
    fsMsg(count + "件のノートをフォルダへ書き出しました。");
  }catch(e){ fsMsg("書き出しに失敗しました：" + (e && e.message ? e.message : e)); }
}
async function fsImport(){
  if(!dirHandle){ fsMsg("先にフォルダを選んでください。"); return; }
  if(await fsPermState(dirHandle, true) !== "granted"){ fsMsg("フォルダへの読み書きが許可されていません。「フォルダを選ぶ」から選び直してください。"); return; }
  try{
    const texts = [];
    for await(const h of dirHandle.values()){
      if(h.kind === "file" && /\.md$/i.test(h.name)){
        const f = await h.getFile();
        texts.push(await f.text());
      }
    }
    if(!texts.length){ fsMsg("フォルダに.mdファイルがありませんでした。"); return; }
    openAiImportWith(texts.join("\n\n" + BULK_SEP + "\n\n"), "フォルダ");
  }catch(e){ fsMsg("読み込みに失敗しました：" + (e && e.message ? e.message : e)); }

async function aiAskImage(prompt, dataUrl){
  const p = aiSet.provider, cfg = aiCfg();
  const model = (cfg.model || "").trim();
  const b64 = String(dataUrl).split(",")[1] || "";
  const timeout = p === "ollama" ? 600000 : 120000;
  if(p === "gemini"){
    const j = await fetchJsonT("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent?key=" + encodeURIComponent(cfg.key.trim()), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }], generationConfig: { temperature: 0.2 } })
    }, timeout);
    const t = j && j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts.map(x => x.text || "").join("");
    if(!t) throw new Error("AIの返答が空でした");
    return t;
  }
  if(p === "claude"){
    const j = await fetchJsonT("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": cfg.key.trim(), "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model, max_tokens: 4000, messages: [{ role: "user", content: [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data: b64 } }, { type: "text", text: prompt }] }] })
    }, timeout);
    const t = (j.content || []).map(x => x.text || "").join("");
    if(!t) throw new Error("AIの返答が空でした");
    return t;
  }
  if(p === "ollama"){
    const base = (cfg.base || "http://localhost:11434").replace(/\/+$/, "");
    const j = await fetchJsonT(base + "/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, stream: false, messages: [{ role: "user", content: prompt, images: [b64] }] })
    }, timeout);
    const t = j.message && j.message.content;
    if(!t) throw new Error("AIの返答が空でした");
    return t;
  }
  const base = p === "compat" ? (cfg.base || "").replace(/\/+$/, "") : "https://api.openai.com/v1";
  if(!base) throw new Error("ベースURLが未設定です");
  const j = await fetchJsonT(base + "/chat/completions", {
    method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key.trim() },
    body: JSON.stringify({ model, temperature: 0.2, messages: [{ role: "user", content: [{ type: "text", text: prompt }, { type: "image_url", image_url: { url: dataUrl } }] }] })
  }, timeout);
  const t = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  if(!t) throw new Error("AIの返答が空でした");
  return t;
}

function inkMsg(t){
  const el = document.getElementById("inkMsg");
  if(el) el.innerHTML = t ? `<div class="msg">${esc(t)}</div>` : "";
}
function initInkCanvas(){
  const cv = document.getElementById("inkCanvas");
  if(!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  cv.width = Math.max(10, Math.round(r.width * dpr));
  cv.height = Math.round(330 * dpr);
  cv.dataset.dpr = dpr;
  inkRedraw();
  cv.addEventListener("pointerdown", inkDown);
  cv.addEventListener("pointermove", inkMove);
  cv.addEventListener("pointerup", inkUp);
  cv.addEventListener("pointercancel", inkUp);
}
function inkPos(e){
  const cv = document.getElementById("inkCanvas");
  const r = cv.getBoundingClientRect();
  const dpr = Number(cv.dataset.dpr || 1);
  return { x: (e.clientX - r.left) * dpr, y: (e.clientY - r.top) * dpr };
}
function inkDown(e){
  if(!ink) return;
  const cv = document.getElementById("inkCanvas");
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  const p = inkPos(e);
  if(ink.eraser){ ink.erasing = true; inkEraseAt(p); return; }
  ink.cur = { c: ink.color, w: ink.width, pts: [p] };
  ink.strokes.push(ink.cur);
  inkRedraw();
}
function inkMove(e){
  if(!ink) return;
  const p = inkPos(e);
  if(ink.eraser){
    if(ink.erasing) inkEraseAt(p);
    return;
  }
  if(!ink.cur) return;
  const last = ink.cur.pts[ink.cur.pts.length - 1];
  if(Math.hypot(p.x - last.x, p.y - last.y) >= 2){ ink.cur.pts.push(p); inkRedraw(); }
}
function inkUp(){
  if(!ink) return;
  ink.cur = null; ink.erasing = false;
}
function inkEraseAt(p){
  const cv = document.getElementById("inkCanvas");
  const dpr = Number((cv && cv.dataset.dpr) || 1);
  const R = 16 * dpr;
  const before = ink.strokes.length;
  ink.strokes = ink.strokes.filter(s => !s.pts.some(pt => Math.hypot(pt.x - p.x, pt.y - p.y) <= R));
  if(ink.strokes.length !== before) inkRedraw();
}
function inkRedraw(){
  const cv = document.getElementById("inkCanvas");
  if(!cv || !ink) return;
  const ctx = cv.getContext("2d");
  const dpr = Number(cv.dataset.dpr || 1);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for(const s of ink.strokes){
    ctx.strokeStyle = s.c;
    ctx.lineWidth = s.w * dpr;
    ctx.beginPath();
    s.pts.forEach((pt, i) => { if(i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
    if(s.pts.length === 1) ctx.lineTo(s.pts[0].x + 0.1, s.pts[0].y + 0.1);
    ctx.stroke();
  }
}
function inkSetTool(eraser){
  if(!ink) return;
  ink.eraser = eraser;
  const p = document.getElementById("inkPen"), e = document.getElementById("inkEra");

  const body = bodyEl ? bodyEl.value : "";
  const n = await createNote(title, body, [], "idea");
  if(keepEl && keepEl.checked && ink && ink.strokes.length){
    const imgId = await saveImage(n.id, inkToDataUrl());
    n.body = n.body.replace(/\s*$/, "") + "\n\n![手書きメモ](kairo-img:" + imgId + ")\n";
    await persistNote(n);
  }
  currentId = n.id; view = "doc"; edMode = "edit";
  closeInk(); render();
}
function closeInk(){ ink = null; closeModal(); }
/* ============ 音声メモ（認識が止まっても内容を失わない） ============ */
let voice = null;
function openVoice(){
  voice = { rec: null, active: false, restarts: 0, hadResult: false, structuredFrom: null };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  openModal(`<h2>🎤 音声メモ</h2>
  <p class="small">${SR ? "話すと、下の欄に文字が入ります。認識が途中で止まっても、入った文字は残ります。いつでも文字で直したり、続きを打ったりできます。" : "このブラウザでは音声認識が使えません。下の欄に文字で入力してください（そのままノートにできます）。"}</p>
  ${SR ? `<button class="btn voicebig" id="voiceBtn" onclick="voiceToggle()">🎤 話し始める</button>
  <div id="voiceStatus" class="small" style="margin-top:8px;">待機中</div>
  <div id="voiceInterim" style="min-height:1.5em; color:var(--teal-dark); font-size:14px;"></div>` : ""}
  <label class="flabel">メモの内容（いつでも編集できます）</label>
  <textarea id="voiceText" rows="7" placeholder="ここに話した内容が入ります。直接打っても構いません。"></textarea>
  <div id="voiceMsg"></div>
  <div class="sheetfoot">
  <div class="btnrow">
    <button class="btn" onclick="voiceSave()">📄 この内容でノートを作る</button>
    ${aiReady() ? `<button class="btn sub" onclick="voiceStructure()">🤖 AIでMarkdownに整える</button>` : ""}
  </div>
  <div class="btnrow">
    <button class="btn ghost" id="voiceUndoBtn" style="display:none;" onclick="voiceUndoStructure()">↩ 整える前の文に戻す</button>
    <button class="btn ghost" onclick="closeVoice()">閉じる</button>
  </div>
  </div>`);
}
function voiceMsg(t){
  const el = document.getElementById("voiceMsg");
  if(el) el.innerHTML = t ? `<div class="msg">${esc(t)}</div>` : "";
}
function voiceUiState(){
  const btn = document.getElementById("voiceBtn");
  const st = document.getElementById("voiceStatus");
  if(!btn || !voice) return;
  if(voice.active){
    btn.textContent = "⏹ 止める";
    btn.classList.add("rec");
    if(st) st.textContent = "聞き取り中…話してください";
  } else {
    btn.textContent = "🎤 話し始める";
    btn.classList.remove("rec");
    if(st && st.textContent === "聞き取り中…話してください") st.textContent = "止まっています。入った文字は下の欄に残っています。";
  }
}
function voiceToggle(){
  if(!voice) return;
  if(voice.active) voiceStop();
  else voiceStart();
}
function voiceStart(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR || !voice) return;
  const rec = new SR();
  rec.lang = "ja-JP";
  rec.interimResults = true;
  rec.continuous = true;
  rec.onresult = e => {
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal){
        const ta = document.getElementById("voiceText");
        if(ta) ta.value += r[0].transcript;
        if(voice) voice.hadResult = true;
      } else interim += r[0].transcript;
    }
    const iv = document.getElementById("voiceInterim");
    if(iv) iv.textContent = interim;
  };
  rec.onend = () => {
    if(voice && voice.active){
      if(voice.hadResult || voice.restarts < 3){
        voice.restarts = voice.hadResult ? 0 : voice.restarts + 1;
        voice.hadResult = false;
        try{ rec.start(); }catch(err){}
        return;
      }
      voice.active = false;
      voiceUiState();
    }
  };
  rec.onerror = e => {
    if(voice) voice.active = false;
    const st = document.getElementById("voiceStatus");
    if(st) st.textContent = "認識が止まりました。入った文字は下の欄に残っています。もう一度ボタンを押すか、文字で続けてください。";
    voiceUiState();
  };
  voice.rec = rec;
  voice.active = true;
  voice.restarts = 0;
  voice.hadResult = false;
  try{ rec.start(); }catch(err){}
  voiceUiState();
}
function voiceStop(){
  if(!voice) return;
  voice.active = false;
  if(voice.rec){ try{ voice.rec.stop(); }catch(err){} }
  voiceUiState();
}
async function voiceStructure(){
  if(!aiReady()){ voiceMsg("AI設定が未完了です。設定で接続先とキーを確認してください。"); return; }
  const ta = document.getElementById("voiceText");
  const text = ta ? ta.value.trim() : "";
  if(!text){ voiceMsg("まず話すか、文字を入力してください。"); return; }
  voiceMsg("AIがMarkdownに整えています…");
  try{
    const out = await aiAsk("次の文章を、内容を変えずにMarkdownで構造化してください。適宜、見出し（##）と箇条書きを使ってください。説明は付けず、構造化した文章だけを返してください。\n\n" + text);
    if(voice) voice.structuredFrom = ta.value;
    ta.value = out.trim();
    const undo = document.getElementById("voiceUndoBtn");
    if(undo) undo.style.display = "";
    voiceMsg("AIが整えた案です。確認・修正してから「この内容でノートを作る」を押してください（まだ保存されていません）。");
  }catch(e){ voiceMsg(aiErrText(e)); }
}
function voiceUndoStructure(){
  const ta = document.getElementById("voiceText");
  if(ta && voice && voice.structuredFrom != null){
    ta.value = voice.structuredFrom;
    voice.structuredFrom = null;
    const undo = document.getElementById("voiceUndoBtn");
    if(undo) undo.style.display = "none";
    voiceMsg("整える前の文に戻しました。");
  }
}
async function voiceSave(){
  const ta = document.getElementById("voiceText");
  const text = ta ? ta.value.trim() : "";
  if(!text){ voiceMsg("内容が空です。話すか、文字を入力してください。"); return; }
  voiceStop();
  const firstLine = text.split("\n")[0].replace(/^#+\s*/, "").trim();
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  const title = firstLine ? firstLine.slice(0, 30) : ("音声メモ " + (d.getMonth() + 1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes()));
  const n = await createNote(title, text, [], "idea");
  currentId = n.id; view = "doc"; edMode = "edit";
  voice = null;
  closeModal(); render();
}
function closeVoice(){
  const ta = document.getElementById("voiceText");
  const has = ta && ta.value.trim().length > 0;
  voiceStop();
  if(has && !confirm("入力した内容は保存されません。閉じますか？")) return;
  voice = null;
  closeModal();
}
/* ============ 起動 ============ */
async function boot(){
  document.getElementById("verFoot").textContent = APP_VER;
  const rows = await idbAll("notes");
  notes = rows.map(r => parseNote(r.id, r.md));
  canvasPos = await metaGet("canvasPos", {});
  mapPos = await metaGet("mapPos", {});
  await loadSnaps();
  await loadImgCache();
  const seeded = await metaGet("seeded", false);
  if(!seeded && notes.length === 0) await seedSamples();
  if(notes.length && !currentId) currentId = sortedNotes()[0].id;
  render();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
boot();
</script>
